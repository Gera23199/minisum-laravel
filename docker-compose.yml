services:
  app1:
    build: .
    container_name: minisum_app1
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql

  app2:
    build: .
    container_name: minisum_app2
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: minisum_mysql
    restart: always
    environment:
      MYSQL_DATABASE: minisum
      MYSQL_ROOT_PASSWORD: Admin123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  nginx:
    image: nginx:alpine
    container_name: minisum_nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app1
      - app2

volumes:
  mysql_data: